receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 128
    spike_limit_mib: 32
  attributes/redaction:
    actions:
      - { key: authorization, action: delete }
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: enduser.email, action: delete }
      - { key: gen_ai.prompt, action: delete }
      - { key: gen_ai.completion, action: delete }
      - { key: alexa.memory.content, action: delete }
      - { key: alexa.dataset.payload, action: delete }
  tail_sampling:
    decision_wait: 10s
    num_traces: 10000
    policies:
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: bounded-success-sample
        type: probabilistic
        probabilistic: { sampling_percentage: 10 }
  batch:
    send_batch_size: 256
    send_batch_max_size: 512
    timeout: 5s
exporters:
  debug:
    verbosity: basic
service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redaction, tail_sampling, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redaction, batch]
      exporters: [debug]
