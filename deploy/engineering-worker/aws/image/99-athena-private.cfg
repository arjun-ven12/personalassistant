#cloud-config
# User data contains only a short-lived scoped workload credential. Never log it.
output:
  all: ">/dev/null 2>&1"
logcfg: |
  [loggers]
  keys=root
  [handlers]
  keys=null
  [formatters]
  keys=plain
  [logger_root]
  level=CRITICAL
  handlers=null
  [handler_null]
  class=NullHandler
  level=CRITICAL
  formatter=plain
  args=()
  [formatter_plain]
  format=%(message)s

# Worker access is signed workload/finite SSM evidence only; no SSH key creation.
ssh_genkeytypes: []
ssh_authorized_keys: []
