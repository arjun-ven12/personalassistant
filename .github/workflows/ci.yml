name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://assistant:test-only@127.0.0.1:5432/assistant_test
      TEST_DATABASE_URL: postgresql://assistant:test-only@127.0.0.1:5432/assistant_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:deploy
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Create disposable Secure Reader integration database
        working-directory: apps/api
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
            try { await pool.query("CREATE DATABASE reader_test_athena_ci"); }
            finally { await pool.end(); }
          '
      - name: Verify Secure Reader integration and isolation
        env:
          ATHENA_READER_DISPOSABLE_TEST: "1"
          ATHENA_READER_TEST_DATABASE_URL: postgresql://assistant:test-only@127.0.0.1:5432/reader_test_athena_ci
        run: pnpm exec vitest run apps/api/src/secure-reader/config.test.ts apps/api/src/secure-reader/integration.test.ts
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:production-config
      - run: pnpm --filter @alexa-control/api security:check
